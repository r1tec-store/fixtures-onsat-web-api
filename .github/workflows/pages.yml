name: Deploy website to GitHub Pages

# GitHub Pages cannot run the Node API, so by default this workflow:
#   1. builds the React site in static-data mode,
#   2. runs the real sync (backend/scripts/export-static.ts) and writes the
#      normalized data as JSON files into the site under /data,
#   3. deploys it — on every push and every 30 minutes to keep data fresh.
# If you also deploy the Node API somewhere, set the repository variable
# API_BASE_URL and the site will call that live API instead of static files.
on:
  push:
    branches: [main]
  schedule:
    # Off the top of the hour: GitHub delays or drops scheduled runs at :00/:30 under load.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build site (live API mode)
        if: vars.API_BASE_URL != ''
        run: npm run build -w frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Build site (static data mode)
        if: vars.API_BASE_URL == ''
        run: npm run build -w frontend
        env:
          VITE_STATIC_DATA: "true"

      # Snapshot of the last successful sync, carried between runs: the source
      # rate-limits shared runner IPs, so the catalog is only re-fetched every
      # few hours and pages that fail keep their last good data.
      - name: Restore sync snapshot
        if: vars.API_BASE_URL == ''
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: pages-snapshot-${{ github.run_id }}
          restore-keys: pages-snapshot-

      - name: Export data from the original sources
        if: vars.API_BASE_URL == ''
        run: npm run export:static -w backend -- ../frontend/dist/data
        env:
          DATA_DIR: ./data
          SOURCE_CONCURRENCY: "2"
          SOURCE_DELAY_MS: "400"
          CATALOG_REFRESH_MINUTES: "360"

      - name: Save sync snapshot
        if: vars.API_BASE_URL == ''
        uses: actions/cache/save@v4
        with:
          path: backend/data
          key: pages-snapshot-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
